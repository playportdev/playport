# What Playport builds from. pp build reads this file and nothing
# else to decide which upstream commits to check out.
#
# madeira is the pin: it must equal the upstream/madeira gitlink.
#
# Wine is taken from its own upstream, not from Madeira (decision 0013): wine
# is the newest WineHQ development tag (wine-11.19; decision 0049), and
# patches/wine-port carries Madeira's Wine fork rebased onto it. wine-port is the madeira-lgpl
# commit that series was rebased from; it must equal Madeira's wine gitlink,
# so a Madeira update that moves its Wine stops the build until the port
# series is refreshed.
#
# The base stays WineHQ's newest development tag; Valve's Wine is not the
# base (decision 0018, which weighed it). wine-valve is the ValveSoftware/wine
# commit that patches/wine-valve, the Valve commits Playport takes, was
# cherry-picked from (still a proton_11.0 commit); the series is applied after
# patches/wine-port in both Wine trees. It moves by hand, by a pick from
# Valve's bleeding-edge branch (decision 0049), never through pp sync; each
# pp sync lists Valve's commits past it in $PLAYPORT_BUILD/sync/wine-valve-new.tsv.
#
# DXMT is taken from its own upstream, not from Madeira: dxmt is a 3Shain/dxmt
# commit, and patches/dxmt-port carries Madeira's DXMT port rebased onto it.
# dxmt-port is the Madeira DXMT commit that series was rebased from; it must
# equal Madeira's research/dxmt gitlink, so a Madeira update that moves its
# DXMT stops the build until the port series is refreshed.
#
# FEX is the same (decision 0008): fex is a FEX-Emu/FEX main commit
# (decision 0049: the head of main, what Proton bleeding-edge ships) and
# patches/fex-port carries Madeira's FEX port rebased onto it; fex-port must
# equal Madeira's FEX gitlink. rpmalloc is that FEX commit's External/rpmalloc
# gitlink (FEX-Emu/rpmalloc) and patches/rpmalloc-port carries Madeira's
# rpmalloc changes rebased onto it; rpmalloc-port must equal the External/
# rpmalloc gitlink of Madeira's FEX.
#
# mesa is a Mesa main commit with patches/mesa on it: KosmicKrisp, Mesa's
# Vulkan driver on Metal, built for iOS by build/stages/mesa.sh; every IPA
# carries it (decision 0015). dxvk and vkd3d-proton are the Vulkan
# backend's Direct3D layers, built by build/stages/vulkan-pe.sh: dxvk
# unmodified, vkd3d-proton with patches/vkd3d-proton.
#
# gbe is gbe_fork (Detanup01/gbe_fork, LGPL-3.0), the Steam API emulator a game
# loads in place of its steam_api(64).dll: its release-2026_09_27 tag, with
# patches/gbe, built by build/stages/steamapi.sh (x86-64 and i386 steam_api).
#
