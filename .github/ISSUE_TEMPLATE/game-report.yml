name: Game compatibility report
description: How a game runs for you, working or not. It goes into the list at playport.dev/compatibility.
title: "Game report: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a game. Reports that it **works** help as much as ones that it does not:
        they go into the [compatibility list](https://playport.dev/compatibility/).
        If it does not work, please attach the log: on the game's page, **Report a problem** shares it
        as a `.zip`. Save it to Files, then drag it into the log box below.
  - type: input
    id: game
    attributes:
      label: Game
      description: Its name, and its Steam app ID if you know it (the number in its store page's address).
      placeholder: Hollow Knight (367520)
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Where it came from
      options:
        - Steam
        - GOG
        - Epic Games
        - Added from Files
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: How it runs
      options:
        - Works (plays as on a PC)
        - Playable with issues (plays, but something is wrong)
        - Broken (does not start, or cannot be played)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: How far you got (menu, gameplay), the frame rate if you know it, and anything wrong. A screenshot helps.
      placeholder: Menus and gameplay at about 60 FPS. Sound crackles in cutscenes.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings that matter
      description: The game page's options you changed, and the game's own graphics settings.
      placeholder: Direct3D Vulkan, frame limit 30, game quality Low
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16, iOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Playport version
      description: Settings, Version.
      placeholder: 0.3.3
    validations:
      required: true
  - type: dropdown
    id: sideloader
    attributes:
      label: How you installed Playport
      options:
        - AltStore
        - SideStore
        - Sideloadly
        - Impactor
        - Xcode
        - Inside LiveContainer
        - Something else (say which above)
    validations:
      required: true
  - type: dropdown
    id: jit
    attributes:
      label: JIT
      options:
        - Playport's own (pairing)
        - StikDebug
        - LiveContainer
        - Not sure
  - type: dropdown
    id: graphics
    attributes:
      label: Graphics
      description: The game's page, Graphics, Direct3D.
      options:
        - Default
        - DXMT
        - Vulkan
        - Not sure
  - type: textarea
    id: log
    attributes:
      label: Log
      description: If it does not work, drag the zipped log from Report a problem here (GitHub takes files up to 25 MB).
    validations:
      required: false
