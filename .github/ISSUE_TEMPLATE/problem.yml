name: Report a game or a problem
description: How a game runs, working or not, or a problem with the app.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Playport. The log is what makes a problem fixable, so please attach it:
        on the game's page, **Report a problem** shares it as a `.zip`. Save it to Files, then drag it
        into the log box below (GitHub takes files up to 25 MB). Before 0.4.0 it shares the bare log:
        long-press it in Files and choose **Compress** first.
  - type: input
    id: game
    attributes:
      label: Game
      description: Its name, and its Steam app ID if you know it (the number in its store page's address).
      placeholder: Hollow Knight (367520)
  - type: dropdown
    id: status
    attributes:
      label: How the game runs
      description: For the compatibility list at playport.dev/compatibility. Leave empty for a problem that is not about one game.
      options:
        - Works
        - Playable with issues
        - Broken
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened instead. A screenshot of an error helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16, iOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Playport version
      description: Settings, Version.
      placeholder: 0.3.3
    validations:
      required: true
  - type: dropdown
    id: sideloader
    attributes:
      label: How you installed it
      options:
        - AltStore
        - SideStore
        - Sideloadly
        - Impactor
        - Xcode
        - Inside LiveContainer
        - Something else (say which below)
    validations:
      required: true
  - type: dropdown
    id: jit
    attributes:
      label: JIT
      options:
        - Playport's own (pairing)
        - StikDebug
        - LiveContainer
        - Not sure
  - type: dropdown
    id: graphics
    attributes:
      label: Graphics
      description: The game's page, Graphics, Direct3D.
      options:
        - Default
        - DXMT
        - Vulkan
        - Not sure
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag the zipped log from Report a problem here.
    validations:
      required: false
