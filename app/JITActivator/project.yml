# SPDX-License-Identifier: GPL-3.0-or-later
name: PlayportJITActivator
options:
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    PRODUCT_BUNDLE_IDENTIFIER: dev.poshagator.jitactivator
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PlayportJITActivator:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Shared
      - path: ../Sources/Relaunch/device_apps.c
      - path: ../Sources/JITHelperXPC
    dependencies:
      - target: PlayportJITTunnel
        embed: true
      - target: PlayportJITWorker
        embed: true
      - framework: ${STIKJIT_FRAMEWORK_DIR}/StikJIT.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: PlayportJITActivator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Activator-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../Sources/Relaunch/include
        LIBRARY_SEARCH_PATHS:
          - ${IDEVICE_LIBRARY_DIR}
        OTHER_LDFLAGS:
          - $(inherited)
          - -lidevice_ffi
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Activator.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Jit activator
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: RemotePairing file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.property-list
              - public.xml
              - public.json
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Подключение к этому iPhone через встроенный VPN для активации JIT.
  PlayportJITTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.poshagator.jitactivator.Tunnel
        CODE_SIGN_ENTITLEMENTS: Activator.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tunnel-Info.plist
        SKIP_INSTALL: YES
    info:
      path: Tunnel-Info.plist
      properties:
        CFBundleDisplayName: Playport JIT Tunnel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
  PlayportJITWorker:
    type: app-extension
    platform: iOS
    sources:
      - path: Helper
      - path: ../Sources/PlayportJITEntry/entry.c
      - path: Shared
      - path: ../Sources/Relaunch/device_apps.c
      - path: ../Sources/JITHelperXPC
      - path: ../PlayportJIT/playport-universal.js
        buildPhase: resources
    dependencies:
      - framework: ${STIKJIT_FRAMEWORK_DIR}/StikJIT.framework
        embed: false
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Activator-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../Sources/Relaunch/include
        LIBRARY_SEARCH_PATHS:
          - ${IDEVICE_LIBRARY_DIR}
        OTHER_LDFLAGS:
          - $(inherited)
          - -lidevice_ffi
        ENABLE_DEBUG_DYLIB: NO
        PRODUCT_NAME: PlayportJITWorker
        PRODUCT_BUNDLE_IDENTIFIER: dev.poshagator.jitactivator.Helper
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Helper-Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../../Frameworks'
        SKIP_INSTALL: YES
    info:
      path: Helper-Info.plist
      properties:
        CFBundleDisplayName: Playport JIT Worker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ar.viewer
          NSExtensionPrincipalClass: PlayportActivatorJITHelper
          NSExtensionAttributes:
            NSExtensionActivationRule: FALSEPREDICATE
